  <script>
    "use strict";

    /*
     * Google Apps Script Web App URL
     * Use the URL copied from:
     * Deploy > Manage deployments > Web app
     *
     * This is the full URL format for the deployment ID
     * supplied in the original code.
     */
    var APP_URL =
      "https://script.google.com/macros/s/AKfycbxVPSPEWUTY9rlPKwUCbtLKz-d7zGpu9-YltJo9g_XOjE8oCfcntv5tD4t0ygOP3_v4/exec";

    var frame = document.getElementById("frame");
    var splash = document.getElementById("splash");
    var msg = document.getElementById("splashMsg");
    var fallback = document.getElementById("fallback");
    var openTab = document.getElementById("openTab");

    var loaded = false;
    var timers = [];
    var retryCount = 0;

    openTab.href = APP_URL;

    function clearTimers() {
      timers.forEach(function (timer) {
        clearTimeout(timer);
      });
      timers = [];
    }

    function start() {
      clearTimers();
      loaded = false;

      fallback.classList.remove("on");
      splash.classList.remove("gone");
      msg.textContent = "Loading Team Board…";

      var url = APP_URL;

      if (retryCount > 0) {
        url += (url.indexOf("?") === -1 ? "?" : "&") +
          "r=" + Date.now();
      }

      retryCount += 1;
      frame.src = url;

      timers.push(setTimeout(function () {
        if (!loaded) {
          msg.textContent =
            "Taking longer than usual — Apps Script is starting up…";
        }
      }, 6000));

      timers.push(setTimeout(function () {
        if (loaded) return;

        splash.classList.add("gone");
        fallback.classList.add("on");
      }, 14000));
    }

    frame.addEventListener("load", function () {
      /*
       * An iframe load event does not guarantee that the
       * embedded application itself has loaded successfully.
       * Cross-origin pages cannot be inspected here.
       */
      if (!frame.getAttribute("src")) return;

      loaded = true;
      clearTimers();
      fallback.classList.remove("on");

      setTimeout(function () {
        splash.classList.add("gone");
      }, 350);
    });

    document.getElementById("retry").addEventListener(
      "click",
      start
    );

    window.addEventListener("offline", function () {
      msg.textContent = "No internet connection";
      splash.classList.remove("gone");
      fallback.classList.add("on");
    });

    window.addEventListener("online", function () {
      if (!loaded) start();
    });

    start();

    /*
     * Storage bridge
     *
     * Supported operations:
     * { __tb: 1, id, op: "get" | "set" | "clear" | "reload",
     *   key, value }
     *
     * Only the keys listed below can be accessed.
     */
    var KEYS = {
      tb_token: true,
      tb_theme: true
    };

    window.addEventListener("message", function (event) {
      var data = event.data;

      if (!data || data.__tb !== 1 || !data.op) return;

      var source = event.source;

      function reply(payload) {
        payload.__tb = 1;
        payload.id = data.id;

        try {
          source.postMessage(payload, "*");
        } catch (error) {
          // Ignore replies to a closed or unavailable frame.
        }
      }

      try {
        if (data.op === "reload") {
          reply({ ok: true });
          window.location.reload();
          return;
        }

        if (!KEYS[data.key]) {
          reply({ ok: false, error: "Unsupported key" });
          return;
        }

        if (data.op === "get") {
          reply({
            value: localStorage.getItem(data.key) || ""
          });
        } else if (data.op === "set") {
          localStorage.setItem(
            data.key,
            data.value == null ? "" : String(data.value)
          );
          reply({ ok: true });
        } else if (data.op === "clear") {
          localStorage.removeItem(data.key);
          reply({ ok: true });
        } else {
          reply({ ok: false, error: "Unsupported operation" });
        }
      } catch (error) {
        reply({ ok: false, error: String(error) });
      }
    }, false);
  </script>
