<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team Board</title>

<!-- zoom allowed (no user-scalable=no) / viewport-fit=cover uses the full screen on notched iPhones -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- iOS -->
<link rel="apple-touch-icon" href="teamboard-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="teamboard-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="teamboard-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="teamboard-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Team Board">
<meta name="description" content="Team Board — shared daily, monthly and yearly tasks, leave and site rotations">

<!-- Android / Chrome -->
<link rel="icon" type="image/png" href="teamboard-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<meta name="color-scheme" content="light">

<style>
  :root{--a:#0f766e;--b:#059669;--c:#65a30d;--t:#fde68a}
  html,body{margin:0;padding:0;height:100%;background:#0f766e;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif}
  #frame{position:fixed;top:0;left:0;width:100%;height:100%;height:100dvh;border:0;display:block;background:#f1f8f6}

  /* ---------- splash ---------- */
  #splash{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:22px;color:#fff;overflow:hidden;
    background:linear-gradient(135deg,#134e4a 0%,var(--a) 38%,var(--b) 70%,var(--c) 120%);
    transition:opacity .55s ease,visibility .55s}
  #splash.gone{opacity:0;visibility:hidden;pointer-events:none}
  #splash::before,#splash::after{content:"";position:absolute;border-radius:50%;pointer-events:none;
    filter:blur(2px);animation:drift 14s ease-in-out infinite alternate}
  #splash::before{width:520px;height:520px;right:-160px;top:-200px;
    background:radial-gradient(closest-side,rgba(251,191,36,.55),transparent 70%)}
  #splash::after{width:460px;height:460px;left:-140px;bottom:-220px;animation-duration:19s;animation-direction:alternate-reverse;
    background:radial-gradient(closest-side,rgba(251,113,133,.42),transparent 70%)}
  @keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-40px,34px,0) scale(1.15)}}
  .badge{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .mark{font-size:52px;font-weight:800;letter-spacing:-.05em;line-height:1;
    background:linear-gradient(92deg,#fff,var(--t));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{font-size:13px;font-weight:600;letter-spacing:.02em;opacity:.85}
  .pills{position:relative;z-index:1;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:0 24px}
  .pills span{font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:99px;
    background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);
    opacity:0;transform:translateY(8px);animation:pop .6s ease forwards}
  .pills span:nth-child(2){animation-delay:.12s}.pills span:nth-child(3){animation-delay:.24s}
  .pills span:nth-child(4){animation-delay:.36s}
  @keyframes pop{to{opacity:1;transform:none}}
  .loadbar{position:relative;z-index:1;width:168px;height:4px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden}
  .loadbar i{position:absolute;inset:0 auto 0 0;width:40%;border-radius:4px;
    background:linear-gradient(90deg,transparent,var(--t),transparent);animation:slide 1.3s ease-in-out infinite}
  @keyframes slide{from{transform:translateX(-110%)}to{transform:translateX(300%)}}
  .sub{position:relative;z-index:1;font-size:12.5px;opacity:.8;font-weight:500;min-height:18px;text-align:center;padding:0 24px}

  /* ---------- slow / failed ---------- */
  #fallback{position:fixed;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:10;
    display:none;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 16px}
  #fallback a,#fallback button{font:inherit;font-size:13px;font-weight:700;padding:11px 20px;border-radius:999px;
    text-decoration:none;cursor:pointer;border:0;box-shadow:0 12px 30px -12px rgba(0,0,0,.6)}
  #fallback a{background:#fff;color:#134e4a}
  #fallback button{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(6px)}
  #fallback.on{display:flex}
  noscript{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:#0f766e;color:#fff;font-size:15px;font-weight:600;padding:24px;text-align:center}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>

<div id="splash" role="status" aria-live="polite">
  <div class="badge">
    <div class="mark">Team Board</div>
    <div class="tag">Shared tasks &middot; Leave &middot; Rotations</div>
  </div>
  <div class="pills"><span>Daily</span><span>Monthly</span><span>Yearly</span><span>Team roster</span></div>
  <div class="loadbar"><i></i></div>
  <div class="sub" id="splashMsg">Loading Team Board…</div>
</div>

<iframe id="frame" title="Team Board"
        allow="clipboard-write; fullscreen"
        referrerpolicy="no-referrer-when-downgrade"></iframe>

<div id="fallback">
  <button id="retry" type="button">Retry</button>
  <a id="openTab" href="#" target="_blank" rel="noopener">Open in browser instead</a>
</div>

<noscript>JavaScript must be enabled to use Team Board</noscript>

<script>
  /* ====== paste your Apps Script /exec link here ====== */
  var APP_URL = "https://script.google.com/macros/s/AKfycbxVPSPEWUTY9rlPKwUCbtLKz-d7zGpu9-YltJo9g_XOjE8oCfcntv5tD4t0ygOP3_v4/exec";
  /* ==================================================== */

  var frame    = document.getElementById('frame'),
      splash   = document.getElementById('splash'),
      msg      = document.getElementById('splashMsg'),
      fallback = document.getElementById('fallback'),
      openTab  = document.getElementById('openTab'),
      loaded   = false, timers = [];

  openTab.href = APP_URL;

  function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

  function start(){
    clearTimers(); loaded = false;
    fallback.classList.remove('on');
    splash.classList.remove('gone');
    msg.textContent = 'Loading Team Board…';
    /* cache-buster only on "Retry", so a fresh Deploy is picked up */
    frame.src = start.n ? APP_URL + (APP_URL.indexOf('?') < 0 ? '?' : '&') + 'r=' + Date.now() : APP_URL;
    start.n = (start.n || 0) + 1;
    timers.push(setTimeout(function(){ if(!loaded) msg.textContent = 'Taking longer than usual — Apps Script is starting up…'; }, 6000));
    timers.push(setTimeout(function(){
      if(loaded) return;
      splash.classList.add('gone');          /* better to show a half-loaded page than a green screen forever */
      fallback.classList.add('on');
    }, 14000));
  }

  frame.addEventListener('load', function(){
    /* the first (empty) iframe fires load too — ignore it */
    if(!frame.getAttribute('src')) return;
    loaded = true; clearTimers();
    fallback.classList.remove('on');
    setTimeout(function(){ splash.classList.add('gone'); }, 350);
  });
  document.getElementById('retry').addEventListener('click', start);
  window.addEventListener('offline', function(){ if(loaded) return; msg.textContent = 'No internet connection'; });
  window.addEventListener('online',  function(){ if(!loaded) start(); });
  start();

  /* ==================================================================
     Storage bridge
     Safari does not let a page inside an iframe keep data on the device.
     This outermost page keeps it instead and hands it back when asked.
     Protocol (same as Index.html): {__tb:1, id, op: get | set | clear | reload, key, value}
     ================================================================== */
  var KEYS = { tb_token:1, tb_theme:1 };
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.__tb !== 1 || !d.op) return;
    var src = e.source;
    function reply(payload) {
      payload.__tb = 1; payload.id = d.id;
      try { src.postMessage(payload, '*'); } catch (err) {}
    }
    try {
      if (d.op === 'reload') { reply({ ok:true }); location.reload(); return; }
      if (!KEYS[d.key]) { reply({ ok:false }); return; }
      if (d.op === 'get')         reply({ value: localStorage.getItem(d.key) || '' });
      else if (d.op === 'set')    { localStorage.setItem(d.key, d.value || ''); reply({ ok:true }); }
      else if (d.op === 'clear')  { localStorage.removeItem(d.key); reply({ ok:true }); }
      else reply({ ok:false });
    } catch (err) { reply({ error:String(err) }); }
  }, false);
</script>
</body>
</html>
